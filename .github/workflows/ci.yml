name: 🧪 CI 质量门禁

# 每次 push / PR 都跑：Python 单测 + 数据门禁 + 前端检查 + 三引擎 E2E
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: 🖥️ 前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 类型检查 + lint + 单测 + 构建
        run: npm run check
  browser-e2e:
    name: 🌐 ${{ matrix.engine }} E2E
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 安装 ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Chromium 桌面 + 移动
        if: matrix.engine == 'chromium'
        run: npx playwright test --project=chromium-desktop --project=chromium-mobile --grep-invert "visual baselines"
      - name: Firefox / WebKit 桌面
        if: matrix.engine != 'chromium'
        run: npx playwright test --project=${{ matrix.engine }}-desktop --grep-invert "visual baselines"

  unit:
    name: 🧩 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-dev.txt
      - name: 安装依赖
        run: pip install -r scripts/requirements.txt -r scripts/requirements-dev.txt
      - name: pytest
        run: python -m pytest test/ -q

  data-gate:
    name: 🔒 数据 + Agent 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: 安装依赖
        run: pip install -r scripts/requirements.txt
      - name: 数据门禁（7 层）
        run: |
          cd scripts
          python3 fundctl.py check --offline
      - name: Agent 规则 + 文档同步校验
        run: |
          cd scripts
          python3 fundctl.py check --agent-rules --offline
